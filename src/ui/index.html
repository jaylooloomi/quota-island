<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Quota Island</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.2 8a7 7 0 0 1 11.6-3L20 8M4 16l3.2 3A7 7 0 0 0 18.8 16"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.5 3-.7 2.2-2 .9-2.1-.5-2.1 3.6 1.5 1.7v2.2l-1.5 1.7 2.1 3.6 2.2-.5 1.9 1 .7 2.1h4.2l.7-2.1 2-1 2.1.5 2.1-3.6-1.5-1.7v-2.2l1.5-1.7L18.5 5l-2.2.5-1.9-.9-.7-2.2z"/><circle cx="11.6" cy="12" r="3"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 24 24"><path d="M4 17V4h16v13M2 20h20l-2-3H4z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 14 4-4M8 16l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M12 18a4 4 0 0 0 6 0l5-5a4 4 0 0 0-6-6l-1 1" transform="translate(1 0) scale(.9)"/></symbol>
  </defs></svg>
  <main class="island" id="island">
    <header class="bar" aria-label="配額動態島">
      <div class="drag grip" title="拖曳移動整座動態島" aria-label="拖曳移動動態島"></div>
      <span class="compact-mode" id="compact-mode">剩餘</span>
      <div id="provider-strip" class="provider-strip">
        <button class="compact-provider claude" data-provider="claude" data-expand draggable="true" title="拖曳排序；Alt + 左右鍵也可排序" aria-label="展開 Claude 配額"><img class="mini-logo" src="icons/claude.svg" alt="" draggable="false"><span class="mini-info"><span class="mini-value" id="mini-claude">同步中</span><span class="mini-window" id="window-claude"></span></span><span class="mini-alert" hidden>!</span></button>
        <button class="compact-provider gemini" data-provider="gemini" data-expand draggable="true" title="拖曳排序；Alt + 左右鍵也可排序" aria-label="展開 Gemini 配額"><img class="mini-logo" src="icons/gemini.svg" alt="" draggable="false"><span class="mini-info"><span class="mini-value" id="mini-gemini">同步中</span><span class="mini-window" id="window-gemini"></span></span><span class="mini-alert" hidden>!</span></button>
        <button class="compact-provider codex" data-provider="codex" data-expand draggable="true" title="拖曳排序；Alt + 左右鍵也可排序" aria-label="展開 Codex 配額"><img class="mini-logo" src="icons/codex.svg" alt="" draggable="false"><span class="mini-info"><span class="mini-value" id="mini-codex">同步中</span><span class="mini-window" id="window-codex"></span></span><span class="mini-alert" hidden>!</span></button>
      </div>
      <button id="toggle" class="icon" aria-label="展開配額面板" aria-expanded="false"><svg><use href="#i-chevron"/></svg></button>
    </header>
    <section id="panel" class="panel" hidden>
      <header class="panel-header">
        <div class="app-title"><h1>Quota Island</h1><span class="live-dot" id="live-dot"></span></div>
        <div class="tools"><button id="refresh" class="icon" aria-label="重新整理配額" title="更新配額（尊重服務冷卻時間）"><svg><use href="#i-refresh"/></svg></button><button id="settings-toggle" class="icon" aria-label="顯示設定" aria-expanded="false" title="設定"><svg><use href="#i-settings"/></svg></button><span class="tool-divider"></span><button id="collapse" class="icon" aria-label="收合配額面板" title="收合"><svg><use href="#i-chevron"/></svg></button></div>
      </header>
      <div class="panel-body">
        <div class="context-line"><h2 id="mode-label">剩餘額度</h2><div class="segmented" role="group" aria-label="配額顯示方式"><button id="mode-remaining" aria-pressed="true">剩餘</button><button id="mode-used" aria-pressed="false">已用</button></div></div>
        <section id="settings" class="settings" hidden aria-label="設定">
          <div class="settings-title">顯示與提醒 <span id="app-version"></span></div>
          <label>保持最上層<input type="checkbox" id="alwaysOnTop" role="switch"></label>
          <label>用量達 90% 時提醒<input type="checkbox" id="notifications" role="switch"></label>
          <div class="settings-title sources-title">監控來源</div>
          <label>Claude Code<input type="checkbox" data-enable="claude" role="switch"></label>
          <label>Gemini<input type="checkbox" data-enable="gemini" role="switch"></label>
          <label>Codex<input type="checkbox" data-enable="codex" role="switch"></label>
          <label>Google 配額來源<select id="google-source"><option value="antigravity">Antigravity（個人版）</option><option value="code_assist">Code Assist（企業版）</option></select></label>
          <p>拖拉服務圖示或卡片標題可排序；左側把手移動整座島。Ctrl / ⌘ + Alt + Q 隱藏或顯示。</p>
          <div class="settings-actions"><button id="hide" class="text-button">隱藏到系統匣</button><button id="quit" class="text-button danger">結束 Quota Island</button></div>
        </section>
        <div id="cards" class="cards" aria-live="polite"></div>
      </div>
      <footer><span class="local-status"><svg><use href="#i-laptop"/></svg>本機執行<span id="demo-banner" class="demo-badge" hidden>展示資料</span></span><span class="footer-sync"><svg><use href="#i-refresh"/></svg><span id="footer-status">自動同步</span><span class="live-dot footer-dot"></span></span></footer>
    </section>
  </main>
  <template id="card-template">
    <article class="card">
      <div class="card-heading"><div class="provider-icon"></div><div class="provider-identity"><h2></h2><div class="provider-description"><span class="provider-subtitle"></span><span class="plan"></span></div></div><button class="connection-status" aria-expanded="false" title="管理帳號連接"><span class="connection-label"><i></i><span class="status-label"></span></span><span class="updated"></span></button></div>
      <div class="quota-windows"></div>
      <div class="empty-state"><div class="empty-title"></div><p class="empty-message"></p><button class="connect-primary text-button"></button></div>
      <section class="connection-details" hidden aria-label="帳號連接">
        <div class="connection-detail-heading"><h3>連接帳號</h3><button class="close-connection icon" aria-label="關閉連接詳情"><svg><use href="#i-close"/></svg></button></div>
        <div class="connection-account"><img class="connection-logo" alt="" draggable="false"><div><h4></h4><p class="connection-description"></p></div></div>
        <ol class="connection-steps" aria-label="連接進度"><li data-step="0"><span></span>授權</li><li data-step="1"><span></span>連接</li><li data-step="2"><span></span>同步</li><li data-step="3"><span></span>完成</li></ol>
        <p class="auth-message"></p>
        <form class="auth-code-form" hidden autocomplete="off"><label>Claude 授權碼<input class="auth-code" type="password" autocomplete="off" spellcheck="false" placeholder="貼上瀏覽器授權頁提供的授權碼" aria-label="Claude 授權碼"></label><button type="submit">完成連接並同步</button></form>
        <div class="connection-actions"><button class="login text-button"></button><button class="reopen-login text-button" hidden>重新開啟授權頁 ↗</button><button class="provider-link text-button" hidden>官方說明 ↗</button></div>
        <div class="setup-links" hidden><button class="text-button">安裝官方 CLI ↗</button></div>
        <details class="source"><summary>資料來源</summary><p></p></details>
        <p class="connection-note">登入完成後自動更新，不必手動查用量。</p>
      </section>
    </article>
  </template>
  <template id="window-template"><div class="quota-row"><div class="quota-label"><span class="window-label"></span><span class="quota-number"></span></div><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="reset"></div></div></template>
  <script src="presentation.js"></script><script src="app.js"></script>
</body>
</html>
