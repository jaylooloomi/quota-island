<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Quota Pebble</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 9a8 8 0 0 0-13.2-3L3.5 9m0-5v5h5M4.5 15a8 8 0 0 0 13.2 3l2.8-3m0 5v-5h-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.5 3-.7 2.2-2 .9-2.1-.5-2.1 3.6 1.5 1.7v2.2l-1.5 1.7 2.1 3.6 2.2-.5 1.9 1 .7 2.1h4.2l.7-2.1 2-1 2.1.5 2.1-3.6-1.5-1.7v-2.2l1.5-1.7L18.5 5l-2.2.5-1.9-.9-.7-2.2z"/><circle cx="11.6" cy="12" r="3"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 24 24"><path d="M4 17V4h16v13M2 20h20l-2-3H4z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><path d="M2 12h20"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20V8"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 14 4-4M8 16l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M12 18a4 4 0 0 0 6 0l5-5a4 4 0 0 0-6-6l-1 1" transform="translate(1 0) scale(.9)"/></symbol>
  </defs></svg>
  <main class="island" id="island">
    <header class="bar" aria-label="配額動態島">
      <div class="compact-brand drag" title="拖曳移動整座動態島" aria-label="拖曳移動動態島"><span class="compact-name">Quota Pebble</span><span id="compact-version"></span></div>
      <span class="compact-mode" id="compact-mode">剩餘</span>
      <div id="provider-strip" class="provider-strip">
        <button class="compact-provider claude" data-provider="claude" data-expand draggable="true" title="拖曳排序；Alt + 左右鍵也可排序" aria-label="展開 Claude 配額"><img class="mini-logo" src="icons/claude.svg" alt="" draggable="false"><span class="mini-info"><span class="mini-value" id="mini-claude">同步中</span><span class="mini-window" id="window-claude"></span></span><span class="mini-alert" hidden>!</span></button>
        <button class="compact-provider gemini" data-provider="gemini" data-expand draggable="true" title="拖曳排序；Alt + 左右鍵也可排序" aria-label="展開 Gemini 配額"><img class="mini-logo" src="icons/gemini.svg" alt="" draggable="false"><span class="mini-info"><span class="mini-value" id="mini-gemini">同步中</span><span class="mini-window" id="window-gemini"></span></span><span class="mini-alert" hidden>!</span></button>
        <button class="compact-provider codex" data-provider="codex" data-expand draggable="true" title="拖曳排序；Alt + 左右鍵也可排序" aria-label="展開 Codex 配額"><img class="mini-logo" src="icons/codex.svg" alt="" draggable="false"><span class="mini-info"><span class="mini-value" id="mini-codex">同步中</span><span class="mini-window" id="window-codex"></span></span><span class="mini-alert" hidden>!</span></button>
      </div>
      <button id="compact-refresh" class="icon" aria-label="重新整理配額"><svg><use href="#i-refresh"/></svg></button><button id="toggle" class="icon" aria-label="展開配額面板" aria-expanded="false"><svg><use href="#i-chevron"/></svg></button>
    </header>
    <section id="panel" class="panel" hidden>
      <header class="panel-header">
        <div class="app-title"><h1>Quota Pebble</h1><span id="header-version"></span><span class="live-dot" id="live-dot"></span></div>
        <div class="tools"><div class="segmented" role="group" aria-label="配額顯示方式"><button id="mode-remaining" aria-pressed="true">剩餘</button><button id="mode-used" aria-pressed="false">已用</button><button id="mode-pacing" aria-pressed="false">配速</button></div><span class="tool-divider"></span><button id="collapse" class="icon" aria-label="收合配額面板" title="收合"><svg><use href="#i-chevron"/></svg></button></div>
      </header>
      <div class="panel-body">
        <div class="context-line"><div class="view-tabs" role="tablist" aria-label="配額與帳號"><button id="tab-quota" role="tab" aria-selected="true" aria-controls="cards"><svg><use href="#i-chart"/></svg>配額</button><button id="tab-accounts" role="tab" aria-selected="false" aria-controls="cards"><svg><use href="#i-user"/></svg>帳號</button></div><h2 id="mode-label">剩餘額度</h2></div>
        <section id="settings" class="settings" hidden aria-label="設定">
          <div class="settings-title">顯示與提醒 <span id="app-version"></span></div>
          <label>語言<select id="language" aria-label="語言"><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></label>
          <label>保持最上層<input type="checkbox" id="alwaysOnTop" role="switch"></label>
          <label>用量達 90% 時提醒<input type="checkbox" id="notifications" role="switch"></label>
          <div class="settings-title sources-title">顯示服務</div>
          <label>Claude<input type="checkbox" data-visible="claude" role="switch"></label>
          <label>Codex<input type="checkbox" data-visible="codex" role="switch"></label>
          <label>Antigravity / Gemini<input type="checkbox" data-visible="gemini" role="switch"></label>
          <div class="settings-title sources-title">監控來源</div>
          <label>Claude Code<input type="checkbox" data-enable="claude" role="switch"></label>
          <label>Gemini<input type="checkbox" data-enable="gemini" role="switch"></label>
          <label>Codex<input type="checkbox" data-enable="codex" role="switch"></label>
          <label>Google 配額來源<select id="google-source"><option value="antigravity">Antigravity（個人版）</option><option value="code_assist">Code Assist（企業版）</option></select></label>
          <p>拖拉服務圖示或卡片標題可排序；左側把手移動整座島。Ctrl / ⌘ + Alt + Q 隱藏或顯示。</p>
          <div class="settings-actions"><button id="hide" class="text-button">隱藏到系統匣</button><button id="quit" class="text-button danger">結束 Quota Pebble</button></div>
        </section>
        <div id="cards" class="cards" aria-live="polite"></div>
        <section id="pace-details" hidden><div class="quota-details-heading"><h2 id="pace-details-title"></h2><button id="close-pace-details" class="text-button">返回配額</button></div><label class="pace-setting">配額窗口<select id="pace-window"></select></label><label class="pace-setting">保留比例<span><input id="pace-reserve" type="range" min="0" max="100" step="1"><output id="pace-reserve-value"></output></span></label><p class="pace-explanation">保留比例以總配額為基準；各來源與窗口獨立計算。</p><div id="pace-summary"></div><p class="pace-explanation">這是平均分配建議，不是用量上限；少於一天的窗口改以每小時計算。</p></section>
        <p id="no-visible-providers" hidden>所有服務已隱藏，請到設定開啟顯示。</p>
        <section id="quota-details" hidden aria-label="所有配額"><div class="quota-details-heading"><h2>Antigravity 配額</h2><button id="close-quota-details" class="text-button">返回配額</button></div><p class="quota-details-note">以下都是 Antigravity 內的配額，不是獨立 Claude Code／Codex 訂閱額度。</p><div id="quota-groups"></div></section>
      </div>
      <div id="language-popover" class="footer-popover language-popover" role="menu" aria-label="語言" hidden><button role="menuitemradio" data-locale="zh-TW">繁體中文</button><button role="menuitemradio" data-locale="en">English</button><button role="menuitemradio" data-locale="ja">日本語</button><button role="menuitemradio" data-locale="ko">한국어</button></div>
      <section id="sync-popover" class="footer-popover sync-popover" role="dialog" tabindex="-1" aria-label="同步詳情" hidden><h3>同步詳情</h3><div id="sync-sources"></div><button id="sync-refresh" class="text-button">重新同步</button><p class="sync-note">限流期間仍會遵守服務冷卻時間。</p></section>
      <footer><span class="footer-local"><svg><use href="#i-laptop"/></svg><span>本機執行</span><span id="footer-version"></span><span id="demo-banner" class="demo-badge" hidden>展示資料</span></span><div class="footer-preferences"><button id="language-shortcut" class="footer-control" aria-haspopup="menu" aria-controls="language-popover" aria-expanded="false"><svg><use href="#i-globe"/></svg>語言</button><button id="settings-toggle" class="footer-control" aria-label="顯示設定" aria-expanded="false"><svg><use href="#i-settings"/></svg>設定</button></div><div class="footer-sync-controls"><button id="refresh" class="icon" aria-label="重新整理配額" title="更新配額（尊重服務冷卻時間）"><svg><use href="#i-refresh"/></svg></button><button id="sync-shortcut" class="footer-control" aria-controls="sync-popover" aria-expanded="false"><span id="sync-summary">自動同步</span><span class="live-dot footer-dot" id="live-footer-dot"></span></button><span id="footer-status" class="sr-only">自動同步</span></div></footer>
    </section>
  </main>
  <template id="card-template">
    <article class="card">
      <div class="card-heading"><div class="provider-icon"></div><div class="provider-identity"><h2></h2><div class="provider-description"><span class="provider-subtitle"></span><span class="plan"></span></div><span class="quota-display-mode"></span></div><button class="connection-status" aria-expanded="false" title="管理帳號連接"><span class="connection-label"><i></i><span class="status-label"></span></span><span class="updated"></span></button></div>
      <div class="quota-windows"></div>
      <button class="quota-details-link text-button" hidden>查看所有配額</button>
      <div class="pacing-content" hidden><div class="pace-heading"><span><strong class="pace-value"></strong><span class="pace-unit"></span></span><span class="pace-reserve-label"></span></div><div class="pace-bar" role="img"></div><div class="pace-meta"><span class="pace-remaining"></span><span class="pace-reset"></span></div><button class="pace-link text-button">配速詳情 ›</button></div>
      <div class="empty-state"><div class="empty-title"></div><p class="empty-message"></p><button class="connect-primary text-button"></button></div>
      <div class="account-actions" hidden><button class="account-switch">切換帳號</button><button class="account-logout danger">登出</button><div class="logout-confirm" hidden><p>登出也會影響本機官方 CLI，確定繼續？</p><button class="confirm-logout danger">確認登出</button><button class="cancel-logout">取消</button></div></div>
      <section class="connection-details" hidden aria-label="帳號連接">
        <div class="connection-detail-heading"><h3>連接帳號</h3><button class="close-connection icon" aria-label="關閉連接詳情"><svg><use href="#i-close"/></svg></button></div>
        <div class="connection-account"><img class="connection-logo" alt="" draggable="false"><div><h4></h4><p class="connection-description"></p></div></div>
        <ol class="connection-steps" aria-label="連接進度"><li data-step="0"><span></span>授權</li><li data-step="1"><span></span>連接</li><li data-step="2"><span></span>同步</li><li data-step="3"><span></span>完成</li></ol>
        <p class="auth-message"></p>
        <form class="auth-code-form" hidden autocomplete="off"><label>Claude 授權碼<input class="auth-code" type="password" autocomplete="off" spellcheck="false" placeholder="貼上瀏覽器授權頁提供的授權碼" aria-label="Claude 授權碼"></label><button type="submit">完成連接並同步</button></form>
        <div class="connection-actions"><button class="login text-button"></button><button class="cancel-login text-button" hidden>取消登入</button><button class="reopen-login text-button" hidden>重新開啟授權頁 ↗</button><button class="provider-link text-button" hidden>官方說明 ↗</button></div>
        <div class="setup-links" hidden><button class="text-button">安裝官方 CLI ↗</button></div>
        <details class="source"><summary>資料來源</summary><p></p></details>
        <p class="connection-note">登入完成後自動更新，不必手動查用量。</p>
      </section>
    </article>
  </template>
  <template id="window-template"><div class="quota-row"><div class="quota-label"><span class="window-label"></span><span class="quota-number"></span></div><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="reset"></div></div></template>
  <script src="presentation.js"></script><script src="i18n.js"></script><script src="app.js"></script>
</body>
</html>
