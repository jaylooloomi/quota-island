name: Desktop checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: macos-latest
            command: dist:mac
          - os: ubuntu-latest
            command: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ runner.os }}
          path: test-results/coverage.txt
      - if: runner.os == 'Windows'
        run: npm run test:tasks
      - if: runner.os == 'Windows'
        run: node scripts/messages-tab-test.cjs
      - if: runner.os == 'Windows'
        run: node scripts/task-filter-fast-test.cjs
        env:
          QUOTA_TEST_CPU_RATE: '4'
      - if: runner.os == 'Windows'
        run: npm run test:sessions
      - run: npm audit --omit=dev
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - if: runner.os == 'Windows'
        run: npm run test:desktop
      - if: runner.os == 'Windows'
        run: node scripts/usage-trends-test.cjs
        env:
          QUOTA_TRENDS_SMALL_SCREEN: '1'
      - if: runner.os == 'Windows'
        run: node scripts/fresh-install-defaults-test.cjs
      - if: runner.os == 'Windows'
        run: npm run test:auth
      - if: runner.os == 'Windows'
        run: npm run test:claude-web
      - if: runner.os == 'Windows'
        run: npm run test:order
      - if: runner.os == 'Windows'
        run: npm run test:design
      - if: runner.os == 'Windows'
        run: npm run test:i18n
        env:
          # Hosted Windows displays can be 768px tall; keep the full settings view testable.
          QUOTA_TEST_SCALE: '0.75'
          QUOTA_TEST_WORKAREA_HEIGHT: '900'
      - run: npm run ${{ matrix.command }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: quota-island-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
